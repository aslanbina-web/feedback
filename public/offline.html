<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>GiveGet — Offline</title>
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:#f4f0e7;color:#111958;font-family:system-ui,sans-serif}.card{width:min(100%,360px);padding:28px 22px;text-align:center;border:5px solid #111958;border-radius:30px;background:#fffaf0;box-shadow:8px 9px 0 #ff684f}.star{width:110px;height:110px}h1{margin:10px 0 8px;font-size:31px}p{margin:0 0 20px;line-height:1.5;color:#4564a5}button{min-height:52px;width:100%;border:3px solid #111958;border-radius:18px;background:#16c795;color:#111958;box-shadow:4px 4px 0 #111958;font-size:18px;font-weight:800}
  </style>
</head>
<body><main class="card"><img class="star" src="/giveget-star.svg" alt=""><h1>You’re offline.</h1><p>Your task is still saved. Reconnect, then continue where you left off.</p><button onclick="location.reload()">Try Again</button></main></body>
</html>
